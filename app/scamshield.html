<title>ScamShield</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=JetBrains+Mono:wght@400;600&family=Noto+Sans+Devanagari:wght@400;600;800&display=swap">
<style>
/* Layout: a two-pane "inspection desk". The message goes in on the left; the verdict, read like an
   official stamp, comes out on the right, followed by a comic of how the scam would play out.
   Large hyperlegible type for older readers, in English and Hindi. */
:root {
  --bg: #eef1f5;
  --paper: #ffffff;
  --ink: #14233a;
  --muted: #56647a;
  --line: #d3dae4;
  --accent: #1d4fd8;
  --accent-ink: #ffffff;
  --scam: #c22a2a;
  --scam-soft: #fde7e5;
  --warn: #a35a00;
  --warn-soft: #fff1d6;
  --safe: #17784a;
  --safe-soft: #e0f4e8;
  --mark: #ffe08a;
  --comic-ink: #1f2430;
  --font-display: "Bricolage Grotesque", "Noto Sans Devanagari", "Avenir Next", "Segoe UI", sans-serif;
  --font-body: "Atkinson Hyperlegible", "Noto Sans Devanagari", "Verdana", "Segoe UI", sans-serif;
  --font-mono: "JetBrains Mono", "Noto Sans Devanagari", ui-monospace, "SF Mono", Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0d1420; --paper: #152032; --ink: #e6ecf5; --muted: #9aa8bd; --line: #2a3a52;
    --accent: #7aa2ff; --accent-ink: #0d1420;
    --scam: #ff7b72; --scam-soft: #3a1a1c; --warn: #f0b85a; --warn-soft: #3a2b12;
    --safe: #5fd39a; --safe-soft: #12301f; --mark: #6b5310;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0d1420; --paper: #152032; --ink: #e6ecf5; --muted: #9aa8bd; --line: #2a3a52;
  --accent: #7aa2ff; --accent-ink: #0d1420;
  --scam: #ff7b72; --scam-soft: #3a1a1c; --warn: #f0b85a; --warn-soft: #3a2b12;
  --safe: #5fd39a; --safe-soft: #12301f; --mark: #6b5310;
  color-scheme: dark;
}

* { box-sizing: border-box; }
body {
  background: var(--bg); color: var(--ink);
  font-family: var(--font-body); font-size: 17px; line-height: 1.55;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 20px 48px;
}
html[lang="hi"] body { line-height: 1.7; }
.wrap { max-width: 1180px; margin: 0 auto; display: flex; flex-direction: column; gap: 22px; }

header { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px 24px; }
.brand { display: flex; align-items: center; gap: 14px; min-width: 0; }
.brand svg { flex: none; }
h1 { font-family: var(--font-display); font-weight: 800; font-size: clamp(30px, 5vw, 42px); line-height: 1; margin: 0; letter-spacing: -0.02em; }
.tag { margin: 4px 0 0; color: var(--muted); font-size: 16px; }
.head-right { display: flex; flex-wrap: wrap; align-items: center; gap: 12px 20px; }
.helpline { font-size: 15px; color: var(--muted); text-align: right; }
.helpline b { color: var(--ink); font-family: var(--font-display); font-size: 22px; letter-spacing: 0.02em; }

.langs { display: inline-flex; border: 1.5px solid var(--accent); border-radius: 999px; overflow: hidden; }
.langs button { font: 700 16px var(--font-body); padding: 8px 16px; border: none; background: transparent; color: var(--accent); cursor: pointer; }
.langs button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); }

.desk { display: grid; grid-template-columns: minmax(0, 5fr) minmax(0, 6fr); gap: 22px; align-items: start; }
@media (max-width: 860px) { .desk { grid-template-columns: minmax(0, 1fr); } }
@media (max-width: 600px) { .helpline { text-align: left; } }

.panel { background: var(--paper); border: 1px solid var(--line); border-radius: 14px; padding: 22px; display: flex; flex-direction: column; gap: 16px; min-width: 0; }
.label { font-size: 13px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); margin: 0; }
html[lang="hi"] .label { letter-spacing: 0; font-size: 15px; }
h2 { font-family: var(--font-display); font-weight: 600; font-size: 22px; margin: 0; text-wrap: balance; }

textarea {
  width: 100%; min-height: 190px; resize: vertical; padding: 14px;
  font: 17px/1.5 var(--font-body); color: var(--ink); background: var(--bg);
  border: 1.5px solid var(--line); border-radius: 10px;
}
textarea:focus-visible, button:focus-visible, .drop:focus-within { outline: 3px solid var(--accent); outline-offset: 2px; }

.examples { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { font: 600 14px var(--font-body); padding: 7px 12px; border-radius: 999px; border: 1px solid var(--line); background: var(--paper); color: var(--ink); cursor: pointer; }
.chip:hover { border-color: var(--accent); color: var(--accent); }
.chip.safe::before { content: "✓ "; color: var(--safe); }

.drop { position: relative; display: flex; align-items: center; gap: 12px; padding: 12px 14px; border: 1.5px dashed var(--line); border-radius: 10px; color: var(--muted); font-size: 15px; cursor: pointer; }
.drop input { position: absolute; width: 1px; height: 1px; opacity: 0; }
.drop img { width: 44px; height: 44px; object-fit: cover; border-radius: 6px; }
.drop .x { margin-left: auto; }

.row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
button.primary, button.secondary {
  font: 700 17px var(--font-body); padding: 13px 20px; border-radius: 10px; cursor: pointer; border: 1.5px solid var(--accent);
}
button.primary { background: var(--accent); color: var(--accent-ink); }
button.secondary { background: transparent; color: var(--accent); }
button:disabled { opacity: 0.5; cursor: default; }
button.link { background: none; border: none; color: var(--accent); font: 600 15px var(--font-body); cursor: pointer; padding: 4px; text-decoration: underline; }
.small { font-size: 14px; color: var(--muted); margin: 0; }

/* Verdict */
.verdict { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 18px 22px; align-items: center; }
.stamp {
  width: 132px; height: 132px; border-radius: 50%; border: 5px double currentColor;
  display: grid; place-content: center; text-align: center; transform: rotate(-8deg);
  font-family: var(--font-display); font-weight: 800; line-height: 1.05;
}
.stamp .pct { font-size: 40px; font-variant-numeric: tabular-nums; }
.stamp .word { font-size: 13px; letter-spacing: 0.1em; text-transform: uppercase; padding: 0 10px; }
html[lang="hi"] .stamp .word { letter-spacing: 0; font-size: 15px; }
.v-scam { color: var(--scam); } .v-warn { color: var(--warn); } .v-safe { color: var(--safe); }
.verdict h2 { font-size: 28px; }
.verdict p { margin: 4px 0 0; }
@media (max-width: 480px) { .verdict { grid-template-columns: minmax(0, 1fr); justify-items: start; } }

.meter { position: relative; height: 12px; border-radius: 6px; background: linear-gradient(90deg, var(--safe) 0 25%, var(--warn) 25% 60%, var(--scam) 60% 100%); opacity: 0.9; }
.meter i { position: absolute; top: -5px; width: 4px; height: 22px; background: var(--ink); border-radius: 2px; transform: translateX(-50%); transition: left 0.5s ease; }
.meter-scale { display: flex; justify-content: space-between; font-size: 13px; color: var(--muted); }

.msg { font-family: var(--font-mono); font-size: 15px; line-height: 1.7; background: var(--bg); border-radius: 10px; padding: 14px; white-space: pre-wrap; overflow-wrap: anywhere; max-height: 260px; overflow-y: auto; }
.msg mark { background: var(--mark); color: inherit; border-radius: 3px; padding: 0 2px; }
.msg mark sup { font: 700 11px var(--font-body); color: var(--scam); margin-left: 2px; }

.tricks { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 10px; }
.trick { display: grid; grid-template-columns: 30px minmax(0, 1fr); gap: 4px 12px; padding: 12px 14px; border-radius: 10px; background: var(--scam-soft); }
.trick.mild { background: var(--warn-soft); }
.trick.good { background: var(--safe-soft); }
.trick .n { width: 26px; height: 26px; border-radius: 50%; display: grid; place-content: center; font: 700 14px var(--font-body); background: var(--paper); color: var(--scam); }
.trick.mild .n { color: var(--warn); } .trick.good .n { color: var(--safe); }
.trick b { font-size: 17px; }
.trick p { grid-column: 2; margin: 0; }
.trick .real { grid-column: 2; font-size: 15px; color: var(--muted); }
.trick.plain { grid-template-columns: minmax(0, 1fr); }
.trick.plain p, .trick.plain .real { grid-column: 1; }

.todo { margin: 0; padding-left: 22px; display: flex; flex-direction: column; gap: 6px; }
.todo li::marker { font-weight: 700; color: var(--accent); }

/* Comic: fixed print palette, like a pamphlet, in both themes */
.comic-wrap { display: flex; flex-direction: column; gap: 10px; }
.comic-head { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: baseline; gap: 6px 12px; }
.comic-head h2 { font-size: 22px; }
.comic { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
@media (max-width: 460px) { .comic { grid-template-columns: minmax(0, 1fr); } }
.cpanel {
  background: #ffffff; color: var(--comic-ink); border: 3px solid var(--comic-ink); border-radius: 6px;
  display: flex; flex-direction: column; overflow: hidden; animation: rise 0.45s ease both;
}
.cpanel:nth-child(2) { animation-delay: 0.12s; } .cpanel:nth-child(3) { animation-delay: 0.24s; }
.cpanel:nth-child(4) { animation-delay: 0.36s; } .cpanel:nth-child(5) { animation-delay: 0.48s; }
@keyframes rise { from { transform: translateY(8px); } to { transform: none; } }
.cpanel svg { display: block; width: 100%; height: auto; }
.from-msg { display: block; margin-top: 4px; font: italic 400 13px/1.4 var(--font-mono); color: #4a4f5a; overflow-wrap: anywhere; }
.cap { padding: 8px 10px; font: 600 15px/1.4 var(--font-body); background: #fff6c2; border-bottom: 3px solid var(--comic-ink); display: flex; gap: 8px; }
.cap span { flex: none; font: 800 14px var(--font-display); background: var(--comic-ink); color: #fff6c2; border-radius: 4px; padding: 0 6px; height: 22px; line-height: 22px; }
.cpanel.ending { grid-column: 1 / -1; border-color: #1e7a46; }
.cpanel.ending .cap { background: #d6f5e1; border-color: #1e7a46; font-size: 17px; }
.cpanel.ending .cap span { background: #1e7a46; color: #d6f5e1; }
.cpanel.ending svg { max-height: 180px; }
@media (prefers-reduced-motion: reduce) { .cpanel { animation: none; } .meter i { transition: none; } }

.ai { border-top: 1px solid var(--line); padding-top: 16px; display: flex; flex-direction: column; gap: 12px; }
.ai-head { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 8px; }
.pill { font: 700 13px var(--font-body); letter-spacing: 0.04em; padding: 4px 10px; border-radius: 999px; }
.pill.v-scam { background: var(--scam-soft); } .pill.v-warn { background: var(--warn-soft); } .pill.v-safe { background: var(--safe-soft); }
.ai-sum { font-size: 19px; margin: 0; }
.quote { font-family: var(--font-mono); font-size: 14px; }
.status { font-size: 15px; color: var(--muted); margin: 0; }

.rules { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 14px; }
.rules div { background: var(--paper); border: 1px solid var(--line); border-radius: 12px; padding: 16px; }
.rules b { display: block; font-family: var(--font-display); font-size: 18px; margin-bottom: 4px; }
.rules p { margin: 0; font-size: 15px; color: var(--muted); }
.acc { display: flex; flex-direction: column; gap: 12px; }
.acc-intro { margin: 0; max-width: 72ch; }
.tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 12px; }
.tile { background: var(--paper); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; display: flex; flex-direction: column; gap: 4px; }
.tile b { font: 800 32px var(--font-display); font-variant-numeric: tabular-nums; }
.tile span { font-size: 15px; color: var(--muted); }
.acc a { color: var(--accent); }
footer { font-size: 14px; color: var(--muted); }
footer a { color: var(--accent); }
</style>

<div class="wrap">
  <header>
    <div class="brand">
      <svg width="52" height="58" viewBox="0 0 52 58" aria-hidden="true">
        <path d="M26 2 L49 10 V28 C49 42 39 52 26 56 C13 52 3 42 3 28 V10 Z" fill="var(--accent)"/>
        <path d="M16 29 L23 36 L37 21" stroke="var(--accent-ink)" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      <div>
        <h1>ScamShield</h1>
        <p class="tag" data-t="tag"></p>
      </div>
    </div>
    <div class="head-right">
      <div class="langs" role="group" aria-label="Language">
        <button type="button" id="l-en" aria-pressed="true">English</button>
        <button type="button" id="l-hi" aria-pressed="false" lang="hi">हिंदी</button>
      </div>
      <div class="helpline"><span data-t="helpline"></span><br><b>1930</b></div>
    </div>
  </header>

  <div class="desk">
    <section class="panel" aria-labelledby="in-h">
      <p class="label" id="in-h" data-t="msgLabel"></p>
      <textarea id="msg" aria-labelledby="in-h"></textarea>
      <div>
        <p class="small" style="margin-bottom:8px" data-t="tryEx"></p>
        <div class="examples" id="examples"></div>
      </div>
      <label class="drop" id="drop" hidden>
        <input type="file" id="shot" accept="image/*">
        <span id="drop-text"></span>
      </label>
      <div class="row">
        <button class="primary" id="check" data-t="check"></button>
        <button class="secondary" id="ask" data-t="ask" hidden></button>
      </div>
      <p class="small" id="privacy"></p>
    </section>

    <section class="panel" aria-live="polite" id="out">
      <div class="verdict">
        <div class="stamp" id="stamp"><span class="pct" id="pct">0%</span><span class="word" id="word"></span></div>
        <div>
          <h2 id="v-title"></h2>
          <p id="v-sub"></p>
        </div>
      </div>
      <div>
        <div class="meter"><i id="needle" style="left:0%"></i></div>
        <div class="meter-scale"><span data-t="m0"></span><span data-t="m1"></span><span data-t="m2"></span></div>
      </div>

      <div id="msg-wrap" hidden>
        <p class="label" style="margin-bottom:8px" data-t="spotted"></p>
        <div class="msg" id="msg-view"></div>
      </div>
      <ol class="tricks" id="tricks"></ol>

      <div class="comic-wrap" id="comic-wrap" hidden>
        <div class="comic-head">
          <h2 data-t="comicTitle"></h2>
          <span class="small" id="comic-note"></span>
        </div>
        <div class="comic" id="comic"></div>
      </div>

      <div id="todo-wrap" hidden>
        <p class="label" style="margin-bottom:8px" data-t="todoLabel"></p>
        <ol class="todo" id="todo"></ol>
      </div>

      <div class="row">
        <button class="link" id="copy" hidden data-t="copy"></button>
        <span class="small" id="copy-note"></span>
      </div>

      <div class="ai" id="ai" hidden>
        <div class="ai-head">
          <p class="label" data-t="aiLabel"></p>
          <span class="pill" id="ai-pill"></span>
        </div>
        <p class="status" id="ai-status"></p>
        <p class="ai-sum" id="ai-sum"></p>
        <ul class="tricks" id="ai-tricks"></ul>
        <ol class="todo" id="ai-todo"></ol>
      </div>
    </section>
  </div>

  <section aria-labelledby="rules-h" style="display:flex;flex-direction:column;gap:12px">
    <h2 id="rules-h" data-t="rulesTitle"></h2>
    <div class="rules">
      <div><b data-t="r1t"></b><p data-t="r1"></p></div>
      <div><b data-t="r2t"></b><p data-t="r2"></p></div>
      <div><b data-t="r3t"></b><p data-t="r3"></p></div>
      <div><b data-t="r4t"></b><p data-t="r4"></p></div>
    </div>
  </section>

  <section aria-labelledby="acc-h" class="acc">
    <h2 id="acc-h" data-t="accTitle"></h2>
    <p class="acc-intro" data-t="accIntro"></p>
    <div class="tiles">
      <div class="tile"><b>77%</b><span data-t="acc1"></span></div>
      <div class="tile"><b>95%</b><span data-t="acc2"></span></div>
      <div class="tile"><b>1.1%</b><span data-t="acc3"></span></div>
      <div class="tile"><b>3.1%</b><span data-t="acc4"></span></div>
    </div>
    <p class="small" id="acc-note"></p>
  </section>

  <footer id="footer"></footer>
</div>

const UI = {

  { id: "clickto", role: "ask", w: 20,

    why: { en: "The link or number leads to someone who will ask for a fee, your bank details or an OTP.", hi: "लिंक या नंबर ऐसे व्यक्ति तक ले जाता है जो फीस, बैंक की जानकारी या OTP माँगेगा।" },
    real: { en: "Real money never needs you to claim it through a link in an SMS.", hi: "असली पैसे के लिए SMS के लिंक से क्लेम नहीं करना पड़ता।" } },
  { id: "replyyes", role: "ask", w: 35,
    re: [/\b(confirm|verify)\b[^.\n]{0,20}\breply(ing)?\b[^.\n]{0,10}\byes\b/gi, /\breply(ing)? (with )?yes\b/gi],

    why: { en: "Replying tells scammers your number is active and that you are worried. A 'helpful' call usually follows.", hi: "जवाब देने से ठग को पता चलता है कि नंबर चालू है और आप घबराए हैं। फिर 'मदद' वाला कॉल आता है।" },
    real: { en: "Banks never ask you to reply to an OTP message. If worried, call the number on your card.", hi: "बैंक कभी OTP मैसेज का जवाब नहीं माँगते। चिंता हो तो कार्ड पर लिखे नंबर पर कॉल करें।" } },

  { id: "kyc", role: "lure", w: 25, story: "kyc",

  { id: "threat", role: "lure", w: 20,

  { id: "debit", role: "lure", w: 12, tone: "mild", story: "debit",

  { id: "challan", role: "lure", w: 30, story: "challan",

  { id: "power", role: "lure", w: 30, story: "power",

  { id: "parcel", role: "lure", w: 15, story: "parcel",

    name: { en: "Parcel or courier 'on hold'", hi: "पार्सल या कूरियर 'रुका हुआ है'" },

  { id: "prize", role: "lure", w: 30, story: "prize",

  { id: "wallet", role: "lure", w: 30, story: "wallet",

  { id: "loan", role: "lure", w: 25, story: "loan",

  { id: "task", role: "lure", w: 30, story: "task",

  { id: "joboffer", role: "lure", w: 25, story: "job_fee",

  { id: "takeover", role: "lure", w: 15, story: "takeover",

  { id: "invest", role: "lure", w: 22, story: "invest",

const SHORTENERS = /^(bit\.ly|tinyurl\.com|cutt\.ly|is\.gd|t\.ly|rb\.gy|shorturl\.at|tiny\.cc|ow\.ly|s\.id|rebrand\.ly|v\.gd|qr\.ae|t\.co|1kx\.in|gmg\.im|sr3\.in|oi1\.in)$/i;
const ODD_TLD = /\.(xyz|top|click|info|live|icu|shop|online|site|buzz|cyou|monster|rest|sbs|cfd|vip|win|link|support|help)$/i;
const OFFICIAL = /(^|\.)(sbi\.co\.in|onlinesbi\.sbi|hdfcbank\.com|icicibank\.com|axisbank\.com|kotak\.com|pnbindia\.in|paytm\.com|phonepe\.com|amazon\.in|amazon\.com|flipkart\.com|indiapost\.gov\.in|incometax\.gov\.in|uidai\.gov\.in|gov\.in|nic\.in|npci\.org\.in|rbi\.org\.in|airtel\.in|myvi\.in|jio\.com|fkrt\.it|goo\.gl)$/i;
const BRAND_WORDS = /(sbi|yono|hdfc|icici|axis|kotak|paytm|phonepe|gpay|npci|rbi|uidai|aadhaar|aadhr|incometax|indiapost|kyc|amazon|flipkart|bank|parivahan|challan)/i;
const LINK_RE = /\b(?:https?:\/\/|www\.)[^\s<>"]+|\b[a-z0-9][a-z0-9-]*(?:\.[a-z0-9-]+)*\.(?:com|in|net|org|co|ly|gd|me|xyz|top|click|info|live|icu|shop|online|site|link|at|cc|ae|sbi|io|im|it|to)\b(?:\/[^\s<>"]*)?/gi;
const SAFE_OTP = /\b(do not|don'?t|never) share\b|share na kar|(शेयर|साझा) न करें|किसी को न बताएं|किसी के साथ (शेयर|साझा) न/i;
const PROMO = /%\s?off\b|\bt\s?&\s?c|\btnc\b|\buse code\b|\bmrp\b|\bsale\b|\brecharge (with|of|now|for)\b|\/kg\b|\bgb\/d(ay)?\b|unlimited calls|\bott\b|subscription|\boffer\b|\bdeals?\b|\bshop now\b|\bapply now\b|\bbuy\s?\d\b|\bb\dg\d\b|\bmovies?\b|\bstreaming\b|\bwatch\b|\bdata pack\b|\bplan\b|\brummy\b|\bplay\b/i;
const WARNING = /\bbeware of\b|\bnever (asks?|sends?|calls?|makes?)\b|\bdo not (respond|click|download)\b|\bdon'?t (respond|click|download)\b|\badvises you\b|\breport (suspected )?fraud\b|\bfake (calls|messages|links|jobs)\b|\bverify the credentials\b|\bbe (alert|cautious)\b|सावधान रहें|झांसे में न आएं/i;
const MESSAGING = /\b(telegram|t\.me|whatsapp|wa\.me)\b/i;
const STORY_PRIORITY = ["arrest", "pin", "remote", "power", "challan", "family", "task", "job_fee", "wallet", "loan", "prize", "card", "takeover", "debit", "otp", "kyc", "parcel", "invest", "refund", "generic"];

function hostOf(u) {
  const s = u.replace(/^https?:\/\//i, "").replace(/^www\./i, "");
  return s.split(/[\/?#:]/)[0].toLowerCase().replace(/[.,)!]+$/, "");
}

function analyze(text) {
  const hits = [];
  for (const r of RULES) {
    const m = [];
    for (const re of r.re) {
      re.lastIndex = 0;
      let x;
      while ((x = re.exec(text))) { m.push({ s: x.index, e: x.index + x[0].length }); if (!x[0].length) re.lastIndex++; }
    }
    if (m.length) hits.push({ rule: r, matches: m });
  }

  // Links get their own judgement.
  const linkFlags = { look: [], ip: [], odd: [], short: [] };
  let officialLink = false, otherLink = false;
  LINK_RE.lastIndex = 0;
  let lm;
  while ((lm = LINK_RE.exec(text))) {
    const host = hostOf(lm[0]);
    if (!host.includes(".")) continue;
    const span = { s: lm.index, e: lm.index + lm[0].length };
    if (/^\d+\.\d+\.\d+\.\d+$/.test(host)) linkFlags.ip.push(span);
    else if (SHORTENERS.test(host)) linkFlags.short.push(span);
    else if (OFFICIAL.test(host)) officialLink = true;
    else if (BRAND_WORDS.test(host)) linkFlags.look.push(span);
    else if (ODD_TLD.test(host)) linkFlags.odd.push(span);
    else otherLink = true;
  }
  for (const lr of LINK_RULES) if (linkFlags[lr.key].length) hits.push({ rule: { ...lr, id: "link-" + lr.key, role: "style" }, matches: linkFlags[lr.key] });

  const has = id => hits.some(h => h.rule.id === id || h.rule.id.startsWith(id));
  const anyRole = role => hits.some(h => h.rule.role === role);
  const ask = anyRole("ask"), lure = anyRole("lure");
  const reach = has("link-") || otherLink || has("callme") || /\bclick (here|the link|on the link|link)\b|\bvia this (secure )?link\b|\bthis link\b/i.test(text);

  let score = hits.reduce((a, h) => a + h.rule.w, 0);
  // Combinations are more telling than any single sign: a lure plus an ask is the shape of a scam.
  if (lure && ask) score += 15;
  if (lure && reach) score += 10;
  if (ask && reach) score += 8;
  if (has("brand") && has("threat")) score += 8;
  if (has("urgent") && (lure || ask)) score += 6;
  if (has("task") && MESSAGING.test(text)) score += 12;
  if (has("family") && (has("urgent") || /\b(pay|money|transfer|send|bill)\b|पैसे|बिल/i.test(text))) score += 12;
  if (has("brand") && !lure && !ask && !has("urgent") && !has("callme")) score -= 10; // a brand alone is normal

  const good = [];
  if (!ask) {
    if (WARNING.test(text)) { score -= 25; good.push(GOOD.warning); }
    else if (PROMO.test(text)) { score -= 15; good.push(GOOD.promo); }
    if (SAFE_OTP.test(text) && !has("link-") && !has("callme")) { score -= 15; good.push(GOOD.otp); }
  }
  if (officialLink && !has("link-")) {
    good.push(GOOD.link);
    // Points only to the real website and asks for nothing: a normal notice or receipt.
    if (!ask && !otherLink && !has("callme")) score -= 20;
  }

  score = Math.max(0, score);
  const p = score === 0 ? 4 : Math.round(Math.min(97, Math.max(3, 100 * (1 - Math.exp(-score / 45)))));

  const stories = new Set(hits.map(h => h.rule.story).filter(Boolean));
  const story = STORY_PRIORITY.find(s => stories.has(s)) || "generic";

  // Strongest signal first, so the comic can quote it.
  hits.sort((a, b) => b.rule.w - a.rule.w);
  const spans = [];
  for (const [i, h] of hits.entries()) for (const m of h.matches) spans.push({ ...m, n: i + 1 });
  return { p, hits, good, spans, story };
}

const BRANDS = [

const AGENCIES = [[/\bcbi\b|सीबीआई/i, "CBI"], [/\bcustoms\b|कस्टम/i, { en: "Customs", hi: "कस्टम" }], [/\bcyber ?crime\b/i, { en: "Cyber Crime", hi: "साइबर क्राइम" }], [/\bpolice\b|पुलिस/i, { en: "Police", hi: "पुलिस" }]];
const UNIT_HI = { lakh: "लाख", lakhs: "लाख", crore: "करोड़", thousand: "हज़ार", "लाख": "लाख", "करोड़": "करोड़" };

function details(text) {
  // Undo "Rs.15,OOO" style disguises before reading amounts.
  const t = text.replace(/\b[\dO][\dO,]*\b/g, m => /\d/.test(m) ? m.replace(/O/g, "0") : m);
  const amounts = [];
  const re = /(?:rs\.?|₹|inr)\s?(\d[\d,]*(?:\.\d+)?)(?:\s*(lakhs?|crore|thousand))?|(\d[\d,.]*)\s*(lakhs?|crore|thousand|लाख|करोड़)|(\d[\d,]*)\s*(?:रुपये|रुपए)/gi;
  let m;
  while ((m = re.exec(t))) {
    let digits = (m[1] || m[3] || m[5]).replace(/[,.]+$/, "");
    const unit = (m[2] || m[4] || "").toLowerCase();
    if (!digits.includes(",") && /^\d{5,}$/.test(digits)) digits = digits.replace(/(\d)(?=(\d\d)+\d$)/g, "$1,");
    const mult = /lakh|लाख/.test(unit) ? 1e5 : /crore|करोड़/.test(unit) ? 1e7 : /thousand/.test(unit) ? 1e3 : 1;
    const value = parseFloat(digits.replace(/,/g, "")) * mult;
    if (!value) continue;
    const before = t.slice(Math.max(0, m.index - 30), m.index);
    amounts.push({
      value, index: m.index,
      isFee: /\b(pay|paying|deposit|transfer|fee|charges?|registration|kit)\b|फीस|शुल्क|भरें/i.test(before) && !/\b(won|win|prize|salary|credited|debited|earn)\b[^,.;]*$/i.test(before),
      label: { en: "₹" + digits + (unit ? " " + unit : ""), hi: "₹" + digits + (unit ? " " + (UNIT_HI[unit] || unit) : "") },
    });
  }
  const fee = amounts.find(a => a.isFee);
  const rest = amounts.filter(a => a !== fee);
  const big = rest.reduce((a, b) => (!a || b.value > a.value ? b : a), null);
  const brandHit = BRANDS.find(([r]) => r.test(text));
  const agencyHit = AGENCIES.find(([r]) => r.test(text));
  const w = text.match(/\b(within \d+ (?:hours?|hrs|minutes|mins)|in \d+ hours?|tonight|today|tomorrow)\b|आज रात|आज|कल|\d+ घंटे में/i);
  let when = null;
  if (w) {
    const x = w[0].toLowerCase(), n = (x.match(/\d+/) || [""])[0];
    // A Hindi deadline still needs an English version for the English comic.
    when = /[ऀ-ॿ]/.test(x) ? { en: x === "आज रात" ? "tonight" : x === "आज" ? "today" : x === "कल" ? "tomorrow" : "within " + n + " hours", hi: x }
      : x === "tonight" ? { en: "tonight", hi: "आज रात" } : x === "today" ? { en: "today", hi: "आज" } : x === "tomorrow" ? { en: "tomorrow", hi: "कल" }
      : /min/.test(x) ? { en: x, hi: n + " मिनट में" } : { en: x, hi: n + " घंटे में" };
  }
  return {
    first: rest[0]?.label, fee: fee?.label, big: big?.label, when,
    brand: brandHit && { en: brandHit[1], hi: brandHit[1] },
    agency: agencyHit && (typeof agencyHit[1] === "string" ? { en: agencyHit[1], hi: agencyHit[1] } : agencyHit[1]),
  };
}

// Dadi or Dadaji, picked from the message itself so the same message always gets the same comic.
function pickElder(text) {
  let h = 0;
  for (const c of text) h = (h * 31 + c.charCodeAt(0)) >>> 0;
  return h % 2 ? "dadaji" : "dadi";
}

function fill(str, ctx) {
  return str.replace(/\{([^}]+)\}/g, (all, k) => (ctx[k] ?? all));
}

// panels: [{scene, caption}] with the last one as the safe ending. quote: words from the message for panel 1.
function renderComic(panels, noteText, quote) {
  const box = $("comic");
  box.innerHTML = "";
  panels.forEach((pn, i) => {
    const last = i === panels.length - 1;
    const d = document.createElement("figure");
    d.className = "cpanel" + (last ? " ending" : "");
    d.style.margin = "0";
    d.style.background = SCENE_BG[last ? "safe" : pn.scene] || "#ffffff";
    d.innerHTML = `<figcaption class="cap"><span></span><div></div></figcaption>${sceneSvg(last ? "safe" : pn.scene)}`;
    d.querySelector(".cap span").textContent = last ? "✓" : String(i + 1);
    const capText = d.querySelector(".cap div");
    capText.textContent = pn.caption;
    if (i === 0 && quote) {
      const q = document.createElement("small");
      q.className = "from-msg";
      q.textContent = t("fromMsg") + " “" + quote + "”";
      capText.append(q);
    }
    box.append(d);
  });
  $("comic-note").textContent = noteText;
  $("comic-wrap").hidden = false;
}

function localComic(r, text) {
  const s = STORIES[r.story] || STORIES.generic;
  const d = details(text);
  const who = ELDERS[ELDER][lang];
  const ctx = { ...who };
  for (const k of ["first", "fee", "big", "when", "brand", "agency"]) {
    const v = d[k] || (k === "first" && d.fee) || s.def[k];
    if (v) ctx[k] = typeof v === "string" ? v : v[lang];
  }
  // Panel 1 quotes the strongest part of the real message.
  const top = r.hits[0]?.matches[0];
  let quote = "";
  if (top) {
    quote = text.slice(top.s, top.e).trim();
    if (quote.length > 70) quote = quote.slice(0, 67) + "...";
  }
  renderComic(s.panels.map(([scene, en, hi]) => ({ scene, caption: fill(lang === "hi" ? hi : en, ctx) })), t("comicNoteLocal"), quote);
}

// ---------- Rendering ----------
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
let lang = "en";
try { if (localStorage.getItem("scamshield-lang") === "hi") lang = "hi"; } catch {}
const t = k => UI[lang][k];
const L = o => (o && typeof o === "object") ? (o[lang] ?? o.en) : (o ?? "");
const bandIdx = p => p >= 60 ? 2 : p >= 25 ? 1 : 0;
const BAND_CLS = ["v-safe", "v-warn", "v-scam"];

function highlight(text, spans) {
  const sorted = [...spans].sort((a, b) => a.s - b.s || b.e - a.e);
  let out = "", pos = 0;
  for (const sp of sorted) {
    if (sp.s < pos) continue; // overlap: keep the first
    out += esc(text.slice(pos, sp.s)) + "<mark>" + esc(text.slice(sp.s, sp.e)) + "<sup>" + sp.n + "</sup></mark>";
    pos = sp.e;
  }
  return out + esc(text.slice(pos));
}

let last = null;
function render(text) {
  text = text.trim();
  if (!text) return;
  const r = analyze(text);
  const bi = bandIdx(r.p), b = t("bands")[bi];
  last = { text, r, bi };
  $("stamp").className = "stamp " + BAND_CLS[bi];
  $("pct").textContent = r.p + "%";
  $("word").textContent = b.word;
  $("v-title").textContent = b.title;
  $("v-sub").textContent = b.sub;
  $("needle").style.left = r.p + "%";

  $("msg-wrap").hidden = false;
  $("msg-view").innerHTML = highlight(text, r.spans);

  const ol = $("tricks");
  ol.innerHTML = "";
  r.hits.forEach((h, i) => {
    const li = document.createElement("li");
    li.className = "trick" + (h.rule.tone === "mild" ? " mild" : "");
    li.innerHTML = `<span class="n">${i + 1}</span><b></b><p></p><span class="real"></span>`;
    li.querySelector("b").textContent = L(h.rule.name);
    li.querySelector("p").textContent = L(h.rule.why);
    li.querySelector(".real").textContent = t("whatsReal") + L(h.rule.real);
    ol.append(li);
  });
  r.good.forEach(g => {
    const li = document.createElement("li");
    li.className = "trick good";
    li.innerHTML = `<span class="n">✓</span><b></b><p></p>`;
    li.querySelector("b").textContent = L(g.name);
    li.querySelector("p").textContent = L(g.why);
    ol.append(li);
  });

  ELDER = pickElder(text);
  if (r.p >= 25) localComic(r, text); else $("comic-wrap").hidden = true;

  $("todo").innerHTML = t("todo")[bi].map(x => "<li>" + esc(x) + "</li>").join("");
  $("todo-wrap").hidden = false;
  $("copy").hidden = false;
  $("copy-note").textContent = "";
}

function renderEmpty() {
  $("stamp").className = "stamp";
  $("pct").textContent = "0%";
  $("word").textContent = "";
  $("v-title").textContent = t("empty");
  $("v-sub").textContent = "";
}

function applyLang() {
  document.documentElement.lang = lang;
  document.querySelectorAll("[data-t]").forEach(el => { el.textContent = t(el.dataset.t); });
  $("footer").innerHTML = t("footer");
  $("privacy").textContent = t(sample ? "privacy" : "privacyLocal");
  $("acc-note").innerHTML = t("accNote");
  $("msg").placeholder = t("placeholder");
  $("l-en").setAttribute("aria-pressed", lang === "en");
  $("l-hi").setAttribute("aria-pressed", lang === "hi");
  setDropText();
  const ex = $("examples");
  ex.innerHTML = "";
  EXAMPLES.forEach(e => {
    const b = document.createElement("button");
    b.className = "chip" + (e.safe ? " safe" : "");
    b.type = "button";
    b.textContent = L(e.label);
    b.onclick = () => { $("msg").value = e.text; clearAi(); render(e.text); };
    ex.append(b);
  });
  clearAi(); // Claude answered in the other language; ask again for this one
  if (last) render(last.text); else renderEmpty();
}
function setLang(l) {
  lang = l;
  try { localStorage.setItem("scamshield-lang", l); } catch {}
  applyLang();
}
$("l-en").onclick = () => setLang("en");
$("l-hi").onclick = () => setLang("hi");

$("check").onclick = () => { clearAi(); render($("msg").value); };
$("msg").addEventListener("keydown", e => { if (e.key === "Enter" && (e.metaKey || e.ctrlKey)) $("check").click(); });

let shot = null;
function setDropText() {
  [...$("drop").querySelectorAll("img,.x")].forEach(n => n.remove());
  const d = $("drop-text");
  if (!shot) { d.textContent = t("drop"); return; }
  const img = document.createElement("img");
  img.alt = "";
  img.src = URL.createObjectURL(shot);
  $("drop").insertBefore(img, d);
  d.textContent = shot.name + t("attached");
  const x = document.createElement("button");
  x.className = "link x"; x.type = "button"; x.textContent = t("remove");
  x.onclick = ev => { ev.preventDefault(); $("shot").value = ""; shot = null; setDropText(); };
  $("drop").append(x);
}
$("shot").onchange = () => { shot = $("shot").files[0] || null; setDropText(); };

$("copy").onclick = () => {
  if (!last) return;
  const lines = [
    t("copyHead")(last.r.p, t("bands")[last.bi].word),
    `${t("copyMsg")}: "${last.text.slice(0, 160)}${last.text.length > 160 ? "..." : ""}"`,
    ...last.r.hits.map((h, i) => `${i + 1}. ${L(h.rule.name)}`),
    t("copyEnd"),
  ];
  navigator.clipboard.writeText(lines.join("\n")).then(
    () => $("copy-note").textContent = t("copied"),
    () => $("copy-note").textContent = t("copyFail")
  );
};

// ---------- Second opinion from Claude ----------
let sample = null, ctl = null, aiResult = null;
function clearAi() { ctl?.abort(); aiResult = null; $("ai").hidden = true; }

(async () => {
  try { sample = await window.claude?.use?.("sample"); } catch { sample = null; }
  if (sample) {
    $("ask").hidden = false;
    $("drop").hidden = false;
    $("privacy").textContent = t("privacy");
  }
})();

function renderAi(a) {
  const p = Math.max(0, Math.min(100, Math.round(Number(a.probability) || 0)));
  const bi = bandIdx(p);
  $("ai").hidden = false;
  $("ai-pill").textContent = p + "% · " + (a.scam_type || t("bands")[bi].word);
  $("ai-pill").className = "pill " + BAND_CLS[bi];
  $("ai-status").textContent = "";
  $("ai-sum").textContent = a.summary || "";
  $("ai-tricks").innerHTML = "";
  (a.tricks || []).slice(0, 4).forEach(tr => {
    const li = document.createElement("li");
    li.className = "trick plain" + (bi === 0 ? " good" : bi === 1 ? " mild" : "");
    li.innerHTML = `<b></b><span class="quote"></span><p></p>`;
    li.querySelector("b").textContent = tr.name || "";
    li.querySelector(".quote").textContent = tr.quote ? "“" + tr.quote + "”" : "";
    li.querySelector("p").textContent = tr.why || "";
    $("ai-tricks").append(li);
  });
  $("ai-todo").innerHTML = (a.do_now || []).slice(0, 3).map(x => "<li>" + esc(x) + "</li>").join("");
  // Claude's comic is made for this exact message, so it replaces the typical one.
  const story = Array.isArray(a.story) ? a.story.filter(s => s && s.caption).slice(0, 4) : [];
  if (p >= 25 && story.length >= 3 && a.safe_ending) {
    renderComic([...story.map(s => ({ scene: String(s.scene || "msg"), caption: String(s.caption) })), { scene: "safe", caption: String(a.safe_ending) }], t("comicNoteAi"));
  }
}

$("ask").onclick = async () => {
  const text = $("msg").value.trim();
  if (!text && !shot) { $("ai").hidden = false; $("ai-status").textContent = t("aiNeed"); return; }
  if (text) render(text);
  const language = lang === "hi" ? "simple Hindi in Devanagari script" : "simple English";
  const found = last && text ? last.r.hits.map(h => h.rule.name.en).join("; ") || "nothing" : "not run (screenshot only)";
  const scenes = Object.keys(SCENES).filter(s => s !== "safe").join(", ");

  const prompt = `You are ScamShield, helping older people in India decide whether a message is a scam.
Judge the message below${shot ? " and the attached screenshot" : ""}. Think about Indian fraud patterns: fake KYC/PAN/Aadhaar updates, UPI collect requests or "enter PIN to receive", OTP sharing, parcel/customs holds, "digital arrest" by fake police/CBI, electricity disconnection, part-time job/task scams, fake investment groups, lottery/KBC, "new number" family emergencies, fake refunds, remote-access apps or APK links, lookalike web addresses. Also allow that it may be a genuine message from a bank or shop.
A simple pattern checker flagged: ${found}.

Write every text field in ${language}, in very plain words for a grandparent.
Reply with ONLY a JSON object, no other text:
{"probability": integer 0-100 that this is a scam,
 "verdict": "likely_scam" | "suspicious" | "likely_safe",
 "scam_type": short name of the scam type, or "" if safe,
 "summary": two short sentences,
 "tricks": [ {"name": trick name, "quote": exact short phrase copied from the message in its original language, "why": one simple sentence} ] (0 to 4 items),
 "do_now": [ up to 3 short steps ],
 "story": [ exactly 4 comic panels showing what would happen to "${ELDERS[ELDER].en.N}" (${ELDER === "dadaji" ? "a grandfather, he" : "a grandmother, she"}) if they believed THIS message, step by step, ending with her losing money. Each is {"scene": one of ${scenes}, "caption": one sentence of at most 16 words, using the real names and amounts from the message where possible} ] (use [] if the message looks safe),
 "safe_ending": one sentence starting with ${lang === "hi" ? '"सही तरीका:"' : '"Instead:"'} saying what ${ELDERS[ELDER].en.N} does to stay safe ("" if safe),
 "extracted_text": ${shot ? "the full message text read from the screenshot" : '""'} }

Message:
"""${text || "(see screenshot)"}"""`;

  aiResult = null;
  $("ai").hidden = false;
  $("ai-pill").textContent = ""; $("ai-pill").className = "pill";
  $("ai-sum").textContent = ""; $("ai-tricks").innerHTML = ""; $("ai-todo").innerHTML = "";
  $("ai-status").textContent = t("aiThinking");
  $("ask").disabled = true;
  ctl = new AbortController();
  try {
    const opts = { signal: ctl.signal };
    if (shot) opts.images = [shot];
    const a = await sample.json(prompt, opts);
    if (shot && !text && a.extracted_text) { $("msg").value = a.extracted_text; render(a.extracted_text); }
    aiResult = a;
    renderAi(a);
  } catch (e) {
    if (e?.code !== "cancelled") $("ai-status").textContent = t("errors")[e?.code] || t("errors").other;
  } finally {
    $("ask").disabled = false;
  }
};

// Open in a working state with a sample loaded.
$("msg").value = EXAMPLES[lang === "hi" ? 1 : 0].text;
last = { text: $("msg").value };
applyLang();
</script>
